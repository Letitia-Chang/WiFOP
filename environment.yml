# conda env export of the `wifop` environment this project was actually
# run and committed with. Recreate with:
#   conda env create -f environment.yml
# (or `mamba env create -f environment.yml`, faster). See requirements.txt
# for a pip-only alternative if conda isn't available.
#
# Not auto-generated from `conda env export` verbatim — pruned to the
# packages this project's scripts actually import, since a full export
# includes hundreds of transitive/unrelated packages from the base conda
# install that would make this file brittle across platforms (conda
# resolves the rest).
name: wifop
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pandas=2.3.3
  - numpy=2.3.4
  - scikit-learn=1.7.2
  - matplotlib=3.10.7
  - joblib=1.5.2
  - scipy=1.16.3
  - requests=2.32.5
  - pytest=9.2.0
  - pip:
      - xgboost==3.1.1
      - catboost==1.2.8
      - shap==0.54.1
      - imbalanced-learn==0.14.0
      - optuna==4.6.0
      - fsspec
      - h5netcdf
      - h5py
